<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1548" />
      <stop offset="100%" stop-color="#0a071d" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeb99" />
      <stop offset="50%" stop-color="#f5c842" />
      <stop offset="100%" stop-color="#c29013" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#4c348f" stroke-width="2" />
  
  <!-- Hourglass Base & Top -->
  <path d="M 28 24 L 72 24 C 74 24 75 26 73 28 L 54 47 C 52 49 52 51 54 53 L 73 72 C 75 74 74 76 72 76 L 28 76 C 26 76 25 74 27 72 L 46 53 C 48 51 48 49 46 47 L 27 28 C 25 26 26 24 28 24 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linejoin="round" />
  <line x1="24" y1="22" x2="76" y2="22" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="24" y1="78" x2="76" y2="78" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
  
  <!-- Magic sand / glow in bottom chamber -->
  <path d="M 36 72 L 64 72 L 53 58 C 51 56 49 56 47 58 Z" fill="#f5c842" opacity="0.85" filter="url(#glow)" />
  
  <!-- Plus Symbol (+) Badge -->
  <circle cx="75" cy="27" r="14" fill="#7c3aed" stroke="url(#goldGrad)" stroke-width="2.5" />
  <path d="M 75 19 L 75 35 M 67 27 L 83 27" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
</svg>

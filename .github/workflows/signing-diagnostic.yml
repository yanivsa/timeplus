name: Signing Diagnostic (read-only)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose signing secrets without printing values
        env:
          KEYSTORE_B64: ${{ secrets.TIMEPLUS_UPLOAD_KEYSTORE_B64 }}
          PW_STORE: ${{ secrets.TIMEPLUS_KEYSTORE_PASSWORD }}
          PW_KEY: ${{ secrets.TIMEPLUS_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TIMEPLUS_KEY_ALIAS }}
          EXPECTED_SHA256: '0A:18:77:98:D4:79:75:94:5A:AE:AB:F6:A8:E5:F4:59:C9:9A:12:68:26:E8:28:B8:52:DE:75:D4:70:24:7B:61'
          EXPECTED_SHA1: '5C:5A:4D:61:90:22:BE:51:74:EB:87:2B:79:13:AF:7B:D4:BD:14:BE'
        run: |
          set -uo pipefail
          if ! printf '%s' "$KEYSTORE_B64" | base64 --decode > /tmp/ks.bin 2>/tmp/b64err; then
            echo "RESULT: B64 decode FAILED - TIMEPLUS_UPLOAD_KEYSTORE_B64 is corrupted/truncated"; cat /tmp/b64err; exit 0
          fi
          echo "Decoded size: $(stat -c%s /tmp/ks.bin) bytes"
          echo "Magic (hex): $(head -c4 /tmp/ks.bin | od -An -tx1 | tr -d ' \n')  (3082=PKCS12, feedfeed=JKS)"
          echo "Configured alias label: $KEY_ALIAS"
          clean() { printf '%s' "$1" | tr -d '\r\n'; }
          OPENED=''
          for label in PW_STORE PW_KEY; do
            for variant in raw clean; do
              if [ "$variant" = raw ]; then cand="${!label}"; else cand="$(clean "${!label}")"; fi
              [ -n "$cand" ] || continue
              if OUT=$(keytool -list -v -keystore /tmp/ks.bin -storepass "$cand" 2>/dev/null); then
                OPENED="$label/$variant"; PASS_USED="$cand"; echo "Opens WITHOUT alias using password label: $OPENED"; break 2
              fi
            done
          done
          if [ -z "$OPENED" ]; then
            echo "RESULT: No supplied password opens the decoded file even without alias."
            echo "=> B64 file and passwords are from different keystores, or the file is not a readable keystore."
            exit 0
          fi
          echo "Aliases in file:"
          keytool -list -keystore /tmp/ks.bin -storepass "$PASS_USED" 2>/dev/null | grep -i "alias name" || true
          ACTUAL256=$(printf '%s' "$OUT" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 | tr '[:lower:]' '[:upper:]')
          ACTUAL1=$(printf '%s' "$OUT" | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p' | head -1 | tr '[:lower:]' '[:upper:]')
          echo "Actual SHA256: $ACTUAL256"
          echo "Actual SHA1: $ACTUAL1"
          if [ "$ACTUAL256" = "$EXPECTED_SHA256" ] && [ "$ACTUAL1" = "$EXPECTED_SHA1" ]; then
            echo "RESULT: Fingerprints MATCH active Play upload key (SHA256+SHA1)."
          else
            echo "RESULT: Fingerprint MISMATCH - decoded B64 is NOT the active post-reset key."
          fi
          rm -f /tmp/ks.bin

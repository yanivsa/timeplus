name: Build Signed Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-play-aab:
    name: Build signed Time+ 1.0.4 AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify required signing secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.TIMEPLUS_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TIMEPLUS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TIMEPLUS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TIMEPLUS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing TIMEPLUS_UPLOAD_KEYSTORE_B64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing TIMEPLUS_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing TIMEPLUS_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing TIMEPLUS_KEY_PASSWORD"; exit 1; }

      - name: Materialize upload keystore securely
        env:
          KEYSTORE_B64: ${{ secrets.TIMEPLUS_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          mkdir -p android/keystores
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/keystores/timeplus-upload-key.jks
          chmod 600 android/keystores/timeplus-upload-key.jks

      - name: Verify release identity
        run: |
          set -euo pipefail
          grep -q 'applicationId "com.yanivsa.timeplus"' android/app/build.gradle
          grep -q 'versionCode 5' android/app/build.gradle
          grep -q 'versionName "1.0.4"' android/app/build.gradle
          grep -q 'PRIMARY_URL = "https://timeplus-app.pages.dev"' android/app/src/main/java/com/yanivsa/timeplus/MainActivity.kt
          grep -q 'FALLBACK_URL = "https://timeplus.yanivsa.workers.dev"' android/app/src/main/java/com/yanivsa/timeplus/MainActivity.kt

      - name: Resolve signing credentials and verify active upload certificate
        env:
          PW_STORE: ${{ secrets.TIMEPLUS_KEYSTORE_PASSWORD }}
          PW_KEY: ${{ secrets.TIMEPLUS_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TIMEPLUS_KEY_ALIAS }}
          EXPECTED_SHA256: '0A:18:77:98:D4:79:75:94:5A:AE:AB:F6:A8:E5:F4:59:C9:9A:12:68:26:E8:28:B8:52:DE:75:D4:70:24:7B:61'
        run: |
          set -euo pipefail
          KS=android/keystores/timeplus-upload-key.jks

          clean_value() {
            printf '%s' "$1" | tr -d '\r\n'
          }

          STORE_CANDIDATES=("$PW_STORE" "$PW_KEY" "$(clean_value "$PW_STORE")" "$(clean_value "$PW_KEY")")
          STORE_PASS=''
          KEYTOOL_OUTPUT=''
          for candidate in "${STORE_CANDIDATES[@]}"; do
            [ -n "$candidate" ] || continue
            if KEYTOOL_OUTPUT=$(keytool -list -v -keystore "$KS" -storepass "$candidate" -alias "$KEY_ALIAS" 2>&1); then
              STORE_PASS="$candidate"
              break
            fi
          done

          if [ -z "$STORE_PASS" ]; then
            echo '::error::Neither supplied signing password opens the uploaded PKCS12 keystore. TIMEPLUS_UPLOAD_KEYSTORE_B64 and TIMEPLUS_KEYSTORE_PASSWORD/TIMEPLUS_KEY_PASSWORD do not belong to the same keystore.'
            exit 1
          fi

          ACTUAL_SHA256=$(printf '%s\n' "$KEYTOOL_OUTPUT" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 | tr '[:lower:]' '[:upper:]')
          test -n "$ACTUAL_SHA256" || { echo '::error::Could not read SHA-256 fingerprint from upload keystore'; exit 1; }
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Upload certificate fingerprint mismatch. Expected active Play upload key $EXPECTED_SHA256 but got $ACTUAL_SHA256"
            exit 1
          fi

          KEY_CANDIDATES=("$PW_KEY" "$PW_STORE" "$(clean_value "$PW_KEY")" "$(clean_value "$PW_STORE")")
          KEY_PASS=''
          mkdir -p .signing-test
          printf 'timeplus-signing-test' > .signing-test/payload.txt
          for candidate in "${KEY_CANDIDATES[@]}"; do
            [ -n "$candidate" ] || continue
            rm -f .signing-test/test.jar
            (cd .signing-test && jar cf test.jar payload.txt)
            if jarsigner -keystore "$KS" -storepass "$STORE_PASS" -keypass "$candidate" .signing-test/test.jar "$KEY_ALIAS" >/dev/null 2>&1; then
              KEY_PASS="$candidate"
              break
            fi
          done
          rm -rf .signing-test

          if [ -z "$KEY_PASS" ]; then
            echo '::error::The keystore opens, but neither supplied password unlocks the signing key alias.'
            exit 1
          fi

          cat > android/keystores/keystore.properties <<EOF
          KEYSTORE_PASSWORD=$STORE_PASS
          KEY_ALIAS=$KEY_ALIAS
          KEY_PASSWORD=$KEY_PASS
          EOF
          chmod 600 android/keystores/keystore.properties

          keytool -export -rfc \
            -keystore "$KS" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" \
            -file upload_certificate.pem
          echo "Verified active upload certificate SHA-256: $ACTUAL_SHA256"

      - name: Build signed release bundle
        run: |
          chmod +x android/gradlew
          android/gradlew -p android clean lintRelease testReleaseUnitTest bundleRelease --no-daemon

      - name: Verify AAB is signed
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          jarsigner -verify -verbose -certs "$AAB" | tee jarsigner-verify.txt
          grep -qi 'jar verified' jarsigner-verify.txt
          unzip -l "$AAB" | grep -Eq 'META-INF/.*\.(RSA|DSA|EC)$'
          sha256sum "$AAB" | tee timeplus-v1.0.4-release.aab.sha256
          cp "$AAB" timeplus-v1.0.4-release.aab

      - name: Upload signed Play release package
        uses: actions/upload-artifact@v4
        with:
          name: timeplus-v1.0.4-signed-play-package
          path: |
            timeplus-v1.0.4-release.aab
            timeplus-v1.0.4-release.aab.sha256
            upload_certificate.pem
          if-no-files-found: error
          retention-days: 90

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/keystores/timeplus-upload-key.jks
          rm -f android/keystores/keystore.properties

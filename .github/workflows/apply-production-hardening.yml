name: Apply Production Hardening Patch

on:
  push:
    branches:
      - fix/production-hardening-2026-10-16

permissions:
  contents: write

jobs:
  apply-hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-hardening-2026-10-16
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply deterministic hardening patch
        run: python3 scripts/apply_production_hardening.py

      - name: Verify regression contracts
        run: node --test worker/tests/production-hardening.test.mjs

      - name: Typecheck Worker
        run: npx tsc --noEmit -p worker/tsconfig.json

      - name: Build web frontend
        run: npm run build:web

      - name: Validate D1 migrations locally
        run: |
          cd worker
          npx wrangler d1 migrations apply timeplus-db --local --persist-to ../.wrangler-hardening

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit verified hardening fixes
        run: |
          if git diff --quiet; then
            echo "No production changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src worker/migrations web/src/context android/app/src/main/java/com/yanivsa/timeplus/MainActivity.kt
          git commit -m "fix: harden production state transitions and auth"
          git push origin HEAD:fix/production-hardening-2026-10-16

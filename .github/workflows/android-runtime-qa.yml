name: Android Runtime QA

on:
  push:
    branches:
      - migration/pages-origin-v1.0.4
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  android-runtime:
    name: Android WebView runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/runtime-qa.sh

      - name: Upload runtime QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-qa
          path: |
            runtime-screen.png
            runtime-window.xml
            runtime-activity.txt
            runtime-logcat.txt
            runtime-devtools.json
            runtime-devtools-child.json
            runtime-devtools-parent.json
          if-no-files-found: warn

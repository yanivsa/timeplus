name: Apply task regression fix

on:
  push:
    branches:
      - fix/task-duplication-hidden-repeatables

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[task-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/task-duplication-hidden-repeatables
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply focused source patch
        run: node scripts/apply-task-regression-fix.mjs

      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/screens/ParentDashboard.tsx worker/src/index.ts
          git commit -m "fix: prevent duplicate tasks and show repeatable tasks [task-fix-applied]"
          git push origin HEAD:fix/task-duplication-hidden-repeatables

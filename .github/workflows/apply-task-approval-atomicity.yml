name: Apply Task Approval Atomicity

on:
  push:
    branches:
      - fix/task-approval-full-atomicity

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/task-approval-full-atomicity
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply task approval patch
        run: python3 scripts/apply_task_approval_atomicity.py

      - name: Verify focused regression
        run: node --test worker/tests/task-approval-atomicity.test.mjs

      - name: Verify production hardening suite
        run: node --test worker/tests/production-hardening.test.mjs worker/tests/task-approval-atomicity.test.mjs

      - name: Typecheck Worker
        run: npx tsc --noEmit -p worker/tsconfig.json

      - name: Verify diff
        run: git diff --check

      - name: Commit verified fix
        run: |
          if git diff --quiet worker/src/tasks.ts; then
            echo "No tasks.ts changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/tasks.ts
          git commit -m "fix: make task approval fully atomic"
          git push origin HEAD:fix/task-approval-full-atomicity

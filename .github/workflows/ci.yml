name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web-and-worker:
    name: Build Web & Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build:web

      - name: Upload Web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Typecheck Worker
        run: npx tsc --noEmit -p worker/tsconfig.json

      - name: Bundle Worker for deployment
        run: |
          cd worker
          npx wrangler deploy --dry-run --outdir ../worker-dist

      - name: Upload Worker bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: worker-dist

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

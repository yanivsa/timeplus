name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  web-and-worker:
    name: Build Web & Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Apply focused task regression source fix
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/task-duplication-hidden-repeatables'
        run: node scripts/apply-task-regression-fix.mjs

      - name: Persist focused task regression source fix
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/task-duplication-hidden-repeatables'
        run: |
          if git diff --quiet; then
            echo "No source changes needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/src/screens/ParentDashboard.tsx worker/src/index.ts
            git commit -m "fix: prevent duplicate tasks and show repeatable tasks [task-fix-applied]"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Install dependencies
        run: npm ci

      - name: Test Haprofessor verification contracts
        run: node --test worker/tests/haprofessor-verifier.test.mjs worker/tests/haprofessor-integration.test.mjs

      - name: Test approval metadata UI contract
        run: node --test web/tests/approval-metadata.test.mjs

      - name: Test Israel timezone UI contract
        run: node --test web/tests/israel-timezone.test.mjs

      - name: Test task creation and repeatable-task regressions
        run: node --test web/tests/task-creation-regression.test.mjs

      - name: Validate D1 migrations locally
        run: |
          cd worker
          npx wrangler d1 migrations apply timeplus-db --local --persist-to ../.wrangler-test

      - name: Build Web Frontend
        run: npm run build:web

      - name: Upload Web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Typecheck Worker
        run: npx tsc --noEmit -p worker/tsconfig.json

      - name: Bundle Worker for deployment
        run: |
          cd worker
          npx wrangler deploy --dry-run --outdir ../worker-dist

      - name: Upload Worker bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: worker-dist

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web-and-worker:
    name: Build Web & Worker
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test Haprofessor verification contracts
        run: node --test worker/tests/haprofessor-verifier.test.mjs worker/tests/haprofessor-integration.test.mjs worker/tests/ai-shadow-confidence.test.mjs worker/tests/ai-stale-recovery.test.mjs

      - name: Test production hardening regressions
        run: node --test worker/tests/production-hardening.test.mjs worker/tests/task-approval-atomicity.test.mjs

      - name: Test approval metadata UI contract
        run: node --test web/tests/approval-metadata.test.mjs

      - name: Test Israel timezone UI contract
        run: node --test web/tests/israel-timezone.test.mjs

      - name: Test dashboard refresh and Academy sync resilience
        run: node --test web/tests/dashboard-refresh.test.mjs worker/tests/academy-sync-resilience.test.mjs

      - name: Test task creation and repeatable-task regressions
        run: node --test web/tests/task-creation-regression.test.mjs

      - name: Validate D1 migrations locally
        run: |
          cd worker
          npx wrangler d1 migrations apply timeplus-db --local --persist-to ../.wrangler-test

      - name: Build Web Frontend
        run: npm run build:web

      - name: Upload Web dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

      - name: Typecheck Worker
        run: npx tsc --noEmit -p worker/tsconfig.json

      - name: Bundle Worker for deployment
        run: |
          cd worker
          npx wrangler deploy --dry-run --outdir ../worker-dist

      - name: Upload Worker bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: worker-bundle
          path: worker-dist

  android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Apply Shadow mode fix
on:
  push:
    branches: [ fix/shadow-never-auto-approve-20261016 ]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[auto-patch]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shadow-never-auto-approve-20261016
          fetch-depth: 0
      - name: Patch Shadow semantics
        shell: python
        run: |
          from pathlib import Path
          p = Path('worker/src/ai-verification.ts')
          s = p.read_text()
          old = "  const automaticMode = mode === 'auto' || professorAutoEnabled;"
          new = "  const automaticMode = mode === 'auto' && (!haprofessorMode || professorAutoEnabled);"
          if old not in s:
              raise SystemExit('automaticMode pattern not found')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/apply-shadow-mode-fix.yml').unlink()
      - name: Commit
        run: |
          git config user.name "timeplus-fix-bot"
          git config user.email "45253818+yanivsa@users.noreply.github.com"
          git add -A
          git commit -m "Make Shadow mode advisory-only [auto-patch]"
          git push origin HEAD:fix/shadow-never-auto-approve-20261016

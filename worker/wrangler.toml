name = "timeplus"
main = "src/index-evidence.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "timeplus-db"
database_id = "6453bce5-c013-4bff-a34d-52cc4bc991d4"

[[kv_namespaces]]
binding = "EVIDENCE_KV"
id = "e6827a1c3bd445e2afc01547df4c75d3"

[[services]]
binding = "FREE_ROUTER"
service = "free-llm-router"

[triggers]
crons = ["* * * * *"]

[vars]
ENVIRONMENT = "production"
DEFAULT_FAMILY_ID = "yaniv_family"
APP_NAME = "Time+"
TIMEZONE = "Asia/Jerusalem"
WEB_VERSION = "1.0.0"
API_VERSION = "1.0.0"
AI_EVIDENCE_ENABLED = "true"
AI_EVIDENCE_MODE = "shadow"
HAPROFESSOR_AUTO_APPROVE_ENABLED = "true"
AI_DIRECT_OPENROUTER_FALLBACK = "true"
EVIDENCE_IMAGE_RETENTION_DAYS = "14"
EVIDENCE_VIDEO_RETENTION_DAYS = "14"
